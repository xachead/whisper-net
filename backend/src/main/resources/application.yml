server:
  port: 8080

spring:
  application:
    name: whispernet-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:whispernetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

whispernet:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:5173"
  rate-limit:
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:30}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    redis:
      enabled: ${REDIS_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout-ms: ${REDIS_TIMEOUT_MS:1000}
      fail-closed: ${REDIS_FAIL_CLOSED:true}
