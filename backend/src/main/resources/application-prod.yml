server:
  port: ${PORT:8080}

spring:
  application:
    name: whispernet-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/whispernetdb}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:whispernet}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: WhisperNetHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false

whispernet:
  cors:
    allowed-origins: ${WHISPERNET_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  rate-limit:
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:30}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    redis:
      enabled: ${REDIS_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      user: ${REDIS_USER:}
      ssl: ${REDIS_SSL:false}
      timeout-ms: ${REDIS_TIMEOUT_MS:1000}
      fail-closed: ${REDIS_FAIL_CLOSED:true}
