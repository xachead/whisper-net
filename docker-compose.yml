services:
  whispernet-db:
    image: postgres:18-alpine
    container_name: whispernet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whispernetdb}
      POSTGRES_USER: ${POSTGRES_USER:-whispernet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whispernetlocal}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whispernet} -d ${POSTGRES_DB:-whispernetdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  whispernet-redis:
    image: redis:7-alpine
    container_name: whispernet-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  whispernet-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whispernet-backend
    restart: unless-stopped
    depends_on:
      whispernet-db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - PORT=${PORT:-8080}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://whispernet-db:5432/whispernetdb}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-whispernet}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-whispernetlocal}
      - HIKARI_MAX_POOL_SIZE=${HIKARI_MAX_POOL_SIZE:-5}
      - HIKARI_MIN_IDLE=${HIKARI_MIN_IDLE:-1}
      - WHISPERNET_CORS_ALLOWED_ORIGINS=${WHISPERNET_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-30}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - REDIS_HOST=${REDIS_HOST:-whispernet-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_USER=${REDIS_USER:-}
      - REDIS_SSL=${REDIS_SSL:-false}
      - REDIS_FAIL_CLOSED=${REDIS_FAIL_CLOSED:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  whispernet-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whispernet-frontend
    restart: unless-stopped
    depends_on:
      whispernet-backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SPRING_BOOT_BACKEND_URL=${SPRING_BOOT_BACKEND_URL:-http://whispernet-backend:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
